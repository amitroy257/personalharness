name: Windows app (installer)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build x64 installers
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci

      - name: Core tests on Windows (includes DPAPI encryption)
        run: cargo test -p harness-core --locked

      - name: Build NSIS (.exe) and MSI installers
        run: npm run tauri build -- --bundles nsis,msi

      - name: List installers
        run: Get-ChildItem target/release/bundle -Recurse -Include *.exe, *.msi | Format-Table FullName, Length

      - name: Smoke test — install, launch, call the local API, check DPAPI and single instance
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Write-Host "Installing $($setup.Name) silently (per-user, no admin)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait

          $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 2 -Include 'personal-harness.exe', 'Personal Harness.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) { throw "installed app not found under $env:LOCALAPPDATA" }
          Write-Host "Installed at $($exe.FullName)"

          Start-Process -FilePath $exe.FullName
          $ok = $false
          for ($i = 1; $i -le 90; $i++) {
            try {
              $r = Invoke-RestMethod http://127.0.0.1:4141/health -TimeoutSec 2
              Write-Host "app answered after ${i}s: $($r | ConvertTo-Json -Compress)"; $ok = $true; break
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { throw "app did not start" }

          $code = (Invoke-WebRequest http://127.0.0.1:4141/v1/models -SkipHttpErrorCheck -UseBasicParsing).StatusCode
          Write-Host "unauthenticated /v1/models -> $code"
          if ($code -ne 401) { throw "expected 401, got $code" }

          $dir = Join-Path $env:LOCALAPPDATA 'io.github.amitroy257.personalharness'
          Get-ChildItem $dir | Format-Table Name, Length
          $stored = (Get-Content (Join-Path $dir 'settings.json') -Raw | ConvertFrom-Json).server.token
          if (-not $stored.StartsWith('dpapi:')) { throw "local API token is not DPAPI-encrypted on disk" }
          Add-Type -AssemblyName System.Security
          $bytes = [Convert]::FromBase64String($stored.Substring(6))
          $token = [Text.Encoding]::UTF8.GetString([Security.Cryptography.ProtectedData]::Unprotect($bytes, $null, 'CurrentUser'))
          $models = Invoke-RestMethod http://127.0.0.1:4141/v1/models -Headers @{ Authorization = "Bearer $token" }
          Write-Host "authenticated /v1/models -> $($models.data.Count) entries: $(($models.data | Select-Object -First 4 -ExpandProperty id) -join ', ')"

          # Launching again (e.g. from the Start menu while hidden in the tray)
          # must focus the running instance, not start a second one.
          Start-Process -FilePath $exe.FullName
          Start-Sleep -Seconds 6
          $count = @(Get-Process -Name $exe.BaseName -ErrorAction SilentlyContinue).Count
          Write-Host "running instances after second launch: $count"
          if ($count -ne 1) { throw "single-instance check failed ($count running)" }
          Stop-Process -Name $exe.BaseName -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PersonalHarness-Windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Attach installers to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
