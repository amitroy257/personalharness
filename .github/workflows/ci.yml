name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the Tauri crate
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build the UI
        run: npm run build
      - name: Core + headless server tests
        run: cargo test -p harness-core -p harness-cli --locked
      - name: Compile the desktop app crate
        run: cargo check -p personal-harness --locked
