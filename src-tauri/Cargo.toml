[package]
name = "personal-harness"
description = "Personal Harness — local OpenRouter-style router for free LLM APIs"
version.workspace = true
edition.workspace = true

[lib]
name = "personal_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
harness-core = { path = "../crates/harness-core" }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.7.2"
tokio = { version = "1.54.1", features = ["sync"] }
