[package]
name = "harness-sync-server"
description = "Zero-knowledge sync server for Personal Harness (stores only end-to-end encrypted blobs)"
version.workspace = true
edition.workspace = true

[[bin]]
name = "harness-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
hmac = "0.13.0"
parking_lot = "0.13.0"
rand = "0.10.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
