[package]
name = "harness-core"
description = "Local OpenAI-compatible router over free LLM API tiers, with model rankings"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
chrono = "0.4.45"
futures-util = "0.3.34"
parking_lot = "0.13.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
base64 = "0.23.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
